apiVersion: argoproj.io/v1alpha1
kind: Application 
metadata: 
  name: ingress 
  namespace: argocd 
  finalizers: 
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default 
  source: 
    repoURL: https://github.com/Tooltu-deve/StreamForge-Gitops.git
    targetRevision: main 
    path: charts/ingress
    helm: 
      valueFiles:
        - ../../values/ingress.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: streamforge 
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]