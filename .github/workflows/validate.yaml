name: validate 

on: 
  pull_request:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v7 

      - name: Install kubeconform 
        run: | 
          curl -sSLo kubeconform.tar.gz \ 
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform 
          sudo mv kubeconform /usr/local/bin/
        
      - name: Helm template + kubeconform (each app) 
        run: |
          for v in values/*.yaml; do 
            svc=$(basename "$v" .yaml)
            case "$svc" in 
              transcode-worker) chart=charts/worker ;;
              ingress)          chart=charts/ingress ;;
              *)                chart=charts/service ;;
            esac 
            echo "== $svc =="
            helm template "$svc" "$chart" -f "$v" \
              | kubeconform -strict -ignore-missing-schemas -summary 
            done 

      - name: Validate Application manifests
        run: kubeconform -strict -ignore-missing-schemas -summary apps/*.yaml